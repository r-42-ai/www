  <svg class="hecke" viewBox="0 0 260 90" preserveAspectRatio="none">

  </svg>
  <svg class="pilz p1" viewBox="0 0 40 40"><rect x="15" y="20" width="10" height="16" rx="4" fill="#F6EFE4"/><path d="M3 22 C3 8 37 8 37 22 Z" fill="#E2483D"/><circle cx="12" cy="16" r="2.6" fill="#fff"/><circle cx="22" cy="12" r="2.2" fill="#fff"/><circle cx="29" cy="18" r="2.4" fill="#fff"/></svg>

      <use href="#blatt-ahorn" x="14" y="32" width="22" height="22" color="#E8742B"/><use href="#blatt-eiche" x="40" y="20" width="22" height="22" color="#D9432F"/>
      <use href="#blatt-ahorn" x="66" y="18" width="24" height="24" color="#F2B33D"/><use href="#blatt-eiche" x="94" y="26" width="22" height="22" color="#C2562A"/>

<!-- Fliegende Besucher ziehen hinter allem durch -->
<div class="besuch himmel-spur" id="besuchHimmel" aria-hidden="true"></div>

<main class="app" id="app">
  <header class="kopfzeile">
    <button class="rund pill" id="homeBtn" type="button" aria-label="Zur Lichtung"><svg viewBox="0 0 24 24"><use href="#i-haus"/></svg></button>
    <button class="rang pill" id="rang" type="button" aria-label="Rang">
      <span class="rang-stern"><svg viewBox="0 0 40 40"><use href="#stern"/></svg><b id="rangNr">1</b></span>
      <span class="rang-text"><small id="rangName">Laub-Neuling</small><span class="balken"><i id="rangBalken"></i></span></span>
    </button>
    <button class="thema-chip pill" id="themaChip" type="button" aria-haspopup="true">
      <svg viewBox="0 0 80 80" id="themaIcon"><use href="#t-brueche"/></svg>
      <span><b id="themaName">Brüche</b><small id="stufeName">Mittel</small></span>
      <svg class="pfeil" viewBox="0 0 24 24"><use href="#i-pfeil-runter"/></svg>
    </button>
    <div class="luecke"></div>
    <div class="pill zaehler serie" id="serie" title="Richtig in Folge" hidden><svg viewBox="0 0 40 40"><use href="#flamme"/></svg><b id="serieN">0</b></div>
    <div class="pill zaehler" id="aepfel" title="Äpfel"><svg viewBox="0 0 40 40" id="apfelZiel"><use href="#apfel"/></svg><b id="aepfelN">0</b></div>
    <div class="pill zaehler ziel" id="ziel" title="Tagesziel">
      <svg viewBox="0 0 36 36" class="ring"><circle cx="18" cy="18" r="14" class="ring-hg"/><circle cx="18" cy="18" r="14" class="ring-vg" id="zielRing"/></svg>
      <b id="zielN">0/10</b>
    </div>
    <button class="rund pill" id="stimmeBtn" type="button" aria-label="Vorlesen ausschalten"><svg viewBox="0 0 24 24"><use href="#i-stimme"/></svg></button>
    <button class="rund pill" id="tonBtn" type="button" aria-label="Geräusche ausschalten"><svg viewBox="0 0 24 24"><use href="#i-ton"/></svg></button>
  </header>

  <!-- LICHTUNG: hier wählt Nea, was sie üben will -->
  <section class="lichtung" id="lichtung">
    <div class="held">
      <div class="held-pieks" id="heldPieks"></div>
      <div class="blase gross" id="blaseHome" role="button" tabindex="0" aria-label="Nochmal vorlesen"><span class="say" aria-live="polite"></span></div>
    </div>
    <div class="wahl">
      <h2 class="wahl-titel">Was üben wir heute?</h2>
      <div class="themen" id="themen"></div>
      <nav class="menue">
        <button type="button" class="menue-btn" id="albumBtn"><svg viewBox="0 0 40 40"><use href="#i-album"/></svg><span>Album</span><i class="neu-punkt" id="albumNeu" hidden></i></button>
        <button type="button" class="menue-btn" id="garderobeBtn"><svg viewBox="0 0 40 40"><use href="#i-garderobe"/></svg><span>Garderobe</span><i class="neu-punkt" id="garderobeNeu" hidden></i></button>
        <button type="button" class="menue-btn" id="erfolgeBtn"><svg viewBox="0 0 40 40"><use href="#pokal"/></svg><span>Erfolge</span></button>
        <button type="button" class="menue-btn" id="elternBtn"><svg viewBox="0 0 40 40"><use href="#i-eltern"/></svg><span>Eltern</span></button>
      </nav>
    </div>
    <div class="boden" id="bodenHome" aria-hidden="true"></div>
  </section>

  <!-- TRAINING -->
  <section class="training" id="training" hidden>
    <div class="buehne" id="buehne">
      <article class="karte" id="karte" aria-live="polite">
        <div class="karte-kopf">
          <span class="nr" id="aufgabeNr">Aufgabe 1</span>
          <span class="belohnung" id="belohnung" title="So viele Äpfel gibt diese Aufgabe"><svg viewBox="0 0 40 40"><use href="#apfel"/></svg><b id="belohnungN">+4</b></span>
        </div>
        <div class="frage" id="frage"></div>
        <div class="rechnung" id="rechnung"></div>
        <div class="loesungsweg" id="loesungsweg" hidden></div>
        <!-- Fakt nach ein paar richtigen Aufgaben, liegt über der gelösten Aufgabe -->
        <div class="faktkarte" id="faktKarte" hidden>
          <div class="fakt-kopf"><span class="fakt-kat" id="faktKat"></span><span class="fakt-neu" id="faktNeu">Neu im Album</span></div>
          <p class="fakt-text" id="faktText"></p>
        </div>
      </article>
      <div class="notiz" id="notiz" hidden>
        <canvas id="notizCanvas"></canvas>
        <div class="notiz-werkzeug">
          <button type="button" class="stift aktiv" data-farbe="#3A3A48" aria-label="Bleistift"><i style="background:#3A3A48"></i></button>
          <button type="button" class="stift" data-farbe="#2F7FA8" aria-label="Blauer Stift"><i style="background:#2F7FA8"></i></button>
          <button type="button" class="stift" data-farbe="#E2483D" aria-label="Roter Stift"><i style="background:#E2483D"></i></button>
          <button type="button" class="stift radierer" data-farbe="radierer" aria-label="Radiergummi"><i></i></button>
          <button type="button" class="notiz-leeren" id="notizLeeren">Leeren</button>
          <button type="button" class="notiz-zu" id="notizZu" aria-label="Notizblock schliessen"><svg viewBox="0 0 24 24"><use href="#i-zu"/></svg></button>
        </div>
      </div>
      <div class="boden" id="bodenTraining" aria-hidden="true"></div>
    </div>

    <aside class="dock" id="dock">
      <div class="buddy">
        <div class="buddy-pieks" id="dockPieks"></div>
        <div class="blase" id="blase" role="button" tabindex="0" aria-label="Nochmal vorlesen"><span class="say" aria-live="polite"></span></div>
      </div>
      <div class="werkzeuge">
        <button type="button" class="werkzeug tipp" id="tippBtn"><svg viewBox="0 0 32 32"><use href="#i-birne"/></svg><span>Tipp</span></button>
        <button type="button" class="werkzeug" id="notizBtn"><svg viewBox="0 0 32 32"><use href="#i-notiz"/></svg><span>Notizblock</span></button>
        <button type="button" class="werkzeug" id="loesungBtn" hidden><svg viewBox="0 0 32 32"><use href="#i-loesung"/></svg><span>Lösung</span></button>
      </div>
      <div class="steuerung">
        <div class="pad" id="pad">
          <button class="taste" type="button" data-k="1">1</button>
          <button class="taste" type="button" data-k="2">2</button>
          <button class="taste" type="button" data-k="3">3</button>
          <button class="taste" type="button" data-k="4">4</button>
          <button class="taste" type="button" data-k="5">5</button>
          <button class="taste" type="button" data-k="6">6</button>
          <button class="taste" type="button" data-k="7">7</button>
          <button class="taste" type="button" data-k="8">8</button>
          <button class="taste" type="button" data-k="9">9</button>
          <button class="taste" type="button" data-k="0">0</button>
          <button class="taste punkt" type="button" data-k="." aria-label="Komma">.</button>
          <button class="taste zurueck" type="button" data-k="back" aria-label="Löschen"><svg viewBox="0 0 32 32"><use href="#i-back"/></svg></button>
          <button class="taste bruch" type="button" data-k="bruch" aria-label="Zum Nenner"><svg viewBox="0 0 32 32"><use href="#i-nenner"/></svg><span>Nenner</span></button>
          <button class="taste pruefen" type="button" data-k="ok" aria-label="Prüfen"><svg viewBox="0 0 32 32"><use href="#i-ok"/></svg></button>
        </div>
        <button class="weiter" id="weiterBtn" type="button">Weiter <svg viewBox="0 0 32 32"><use href="#i-weiter"/></svg></button>
      </div>
    </aside>
  </section>
</main>

<!-- Stufe und Thema wechseln, ohne zurück zur Lichtung -->
<div class="popover" id="stufenMenue" hidden>
  <div class="pop-titel">Schwierigkeit</div>
  <div class="pop-stufen" id="popStufen"></div>
  <div class="pop-titel">Thema</div>
  <div class="pop-themen" id="popThemen"></div>
</div>

<div class="fx" id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"><div class="ic" id="toastIc"></div><div><b id="toastT"></b><span id="toastS"></span></div></div>

<!-- Fenster -->
<div class="overlay" id="fenster" hidden>
  <div class="fenster-karte" id="fensterKarte" role="dialog" aria-modal="true" aria-labelledby="fensterTitel">
    <div class="fenster-kopf">
      <h2 id="fensterTitel"></h2>
      <button type="button" class="rund" id="fensterZu" aria-label="Schliessen"><svg viewBox="0 0 24 24"><use href="#i-zu"/></svg></button>
    </div>
    <div class="fenster-tabs" id="fensterTabs"></div>
    <div class="fenster-inhalt" id="fensterInhalt"></div>
  </div>
</div>

<!-- Start: Pieks schläft, ein Tipp weckt ihn (und gibt den Ton frei) -->
<div class="start" id="start" hidden>
  <div class="start-karte">
    <div class="start-kugel" id="startKugel"></div>
    <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
    <h1>Mathe-Igel</h1>
    <p class="start-text" id="startText">Pieks hält gerade ein Nickerchen.</p>
    <button class="los" id="weckenBtn" type="button">Pieks wecken!</button>
  </div>
</div>

<!-- Passwort, geteilt mit Yunas App -->
<div class="start pw" id="pwOvl" hidden>
  <div class="start-karte">
    <div class="start-kugel" id="pwKugel"></div>
    <h1>Mathe-Igel</h1>
    <p class="start-text">Wie heisst das Zauberwort?</p>
    <form id="pwForm" autocomplete="on">
      <input type="password" id="pwInput" autocomplete="current-password" aria-label="Passwort">
      <button class="los" id="pwBtn" type="submit">OK</button>
    </form>
    <div class="pw-err" id="pwErr" aria-live="polite"></div>
  </div>
</div>

<script src="aufgaben.js"></script>
<script src="texte.js"></script>
<script src="fakten.js"></script>
<script src="grafik.js"></script>
<script src="app.js"></script>
</body>
</html>
