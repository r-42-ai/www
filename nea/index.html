<script>
const gcd=(a,b)=>b===0?Math.abs(a):gcd(b,a%b);
function simplify(n,d){if(d===0)return[n,d];const g=gcd(n,d);return[n/g,d/g]}
function fracEqual(n1,d1,n2,d2){if(d1===0||d2===0)return false;return n1*d2===n2*d1}
function isSimplified(n,d){return gcd(Math.abs(n),Math.abs(d))===1}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function fracHTML(n,d){return`<span class="fraction"><span class="num">${n}</span><span class="bar"></span><span class="den">${d}</span></span>`}
function mixedHTML(g,n,d){return`<span class="mixed"><span class="whole">${g}</span>${fracHTML(n,d)}</span>`}
function vol(v,u){return`<span class="vol"><span class="vol-val">${v}</span><span class="vol-unit">${u}</span></span>`}
const NAMES=['Nea','Yuna','Lukas','Mia','Ben','Lea','Tim','Anna','Noah','Emma','Felix','Lina','Jonas','Sara','Leo','Zoe'];
function pickName(){return NAMES[rand(0,NAMES.length-1)]}
function pickTwoNames(){const a=pickName();let b=pickName();while(b===a)b=pickName();return[a,b]}

// ============ BRÜCHE: Operationen ============
function addSame(lv){const m=lv==='easy'?8:12;const d=rand(3,m),a=rand(1,d-1),b=rand(1,d-a);return{equation:`${fracHTML(a,d)} <span class="op">+</span> ${fracHTML(b,d)} <span class="op">=</span>`,answerType:'fraction',correctNum:a+b,correctDen:d}}
function subSame(lv){const m=lv==='easy'?8:12;const d=rand(3,m),a=rand(2,d-1),b=rand(1,a-1);return{equation:`${fracHTML(a,d)} <span class="op">−</span> ${fracHTML(b,d)} <span class="op">=</span>`,answerType:'fraction',correctNum:a-b,correctDen:d}}
function addDiff(){const d1=rand(2,8);let d2=rand(2,8);while(d2===d1)d2=rand(2,8);const a=rand(1,d1-1),b=rand(1,d2-1);return{equation:`${fracHTML(a,d1)} <span class="op">+</span> ${fracHTML(b,d2)} <span class="op">=</span>`,answerType:'fraction',correctNum:a*d2+b*d1,correctDen:d1*d2}}
function subDiff(){const d1=rand(2,8);let d2=rand(2,8);while(d2===d1)d2=rand(2,8);const a=rand(1,d1-1),b=rand(1,d2-1);if(a*d2<=b*d1)return subDiff();return{equation:`${fracHTML(a,d1)} <span class="op">−</span> ${fracHTML(b,d2)} <span class="op">=</span>`,answerType:'fraction',correctNum:a*d2-b*d1,correctDen:d1*d2}}
function mulFrac(){const d1=rand(2,8),d2=rand(2,8),a=rand(1,d1-1),b=rand(1,d2-1);return{equation:`${fracHTML(a,d1)} <span class="op">·</span> ${fracHTML(b,d2)} <span class="op">=</span>`,answerType:'fraction',correctNum:a*b,correctDen:d1*d2}}
function divFrac(){const d1=rand(2,8),d2=rand(2,8),a=rand(1,d1-1),b=rand(1,d2-1);return{equation:`${fracHTML(a,d1)} <span class="op">:</span> ${fracHTML(b,d2)} <span class="op">=</span>`,answerType:'fraction',correctNum:a*d2,correctDen:d1*b}}
function mixedAdd(){const g=rand(1,4),d=rand(3,8),a=rand(1,d-1),b=rand(1,d-1);return{text:'Berechne und gib das Ergebnis als unechten Bruch an:',equation:`${mixedHTML(g,a,d)} <span class="op">+</span> ${fracHTML(b,d)} <span class="op">=</span>`,answerType:'fraction',correctNum:g*d+a+b,correctDen:d}}
function mixedSub(){const g=rand(1,3),d=rand(3,8),a=rand(1,d-1),b=rand(1,d-1);return{text:'Berechne (Antwort als unechter Bruch):',equation:`${mixedHTML(g,a,d)} <span class="op">−</span> ${fracHTML(b,d)} <span class="op">=</span>`,answerType:'fraction',correctNum:g*d+a-b,correctDen:d}}
function simplifyFrac(){const b=rand(4,9),a=rand(1,b-1),g=gcd(a,b),sa=a/g,sb=b/g,k=rand(2,4);return{text:'Kürze den Bruch so weit wie möglich:',equation:`${fracHTML(sa*k,sb*k)} <span class="op">=</span>`,answerType:'fraction',correctNum:sa,correctDen:sb}}
function mulFracWhole(){const d=rand(2,9),a=rand(1,d-1),k=rand(2,5);return{equation:`${k} <span class="op">·</span> ${fracHTML(a,d)} <span class="op">=</span>`,answerType:'fraction',correctNum:k*a,correctDen:d}}
function fracOfNumber(lv){const ds=lv==='easy'?[2,3,4]:[2,3,4,5,6,8];const d=ds[rand(0,ds.length-1)];const a=lv==='easy'?1:rand(1,d-1);const t=d*rand(2,lv==='hard'?9:6);return{text:'Berechne:',equation:`${fracHTML(a,d)} <span class="op">von</span> ${t} <span class="op">=</span>`,answerType:'whole',correctValue:(t/d)*a}}
const fp=(t,n,d)=>({text:t,equation:'',answerType:'fraction',correctNum:n,correctDen:d});
const wp=(t,v)=>({text:t,equation:'',answerType:'whole',correctValue:v});

// ============ BRÜCHE: Textaufgaben ============
const TEMPLATES_EASY=[
()=>{const d=rand(4,12),n=rand(1,d-1);return fp(`Eine Pizza wird in ${d} gleich grosse Stücke geteilt. ${pickName()} isst ${n} Stück${n===1?'':'e'}. Welcher Bruch der Pizza ist gegessen?`,n,d)},
()=>{const d=rand(4,10),n=rand(1,d-1);return fp(`Eine Tafel Schoggi hat ${d} Reihen. ${pickName()} isst ${n} Reihe${n===1?'':'n'}. Welcher Bruch der Tafel ist gegessen?`,n,d)},
()=>{const d=rand(4,8),n=rand(1,d-1);return fp(`Im Garten gibt es ${d} gleich grosse Beete. In ${n} davon wachsen Tomaten. Welcher Bruch der Beete hat Tomaten?`,n,d)},
()=>{const d=rand(8,16),n=rand(2,d-2);return fp(`In ${pickName()}s Klasse sind ${d} Kinder. ${n} davon tragen eine Brille. Welcher Bruch der Kinder trägt eine Brille?`,n,d)},
()=>{const d=rand(4,8),n=rand(1,d-1);return fp(`Eine Banane wird in ${d} Stücke geschnitten. ${pickName()} isst ${n} Stück${n===1?'':'e'}. Welcher Bruch der Banane ist gegessen?`,n,d)},

function vSubSameOp(){const r=rand(0,3);let a,b,u;if(r===0){u='ml';a=rand(3,9)*100;b=rand(1,(a/100)-1)*100}else if(r===1){u='cl';a=rand(20,90);b=rand(5,a-5)}else if(r===2){u='dl';a=rand(3,9);b=rand(1,a-1)}else{u='l';a=rand(2,9);b=rand(1,a-1)}return vTask('',`${vol(a,u)} <span class="op">−</span> ${vol(b,u)} <span class="op">=</span>`,a-b,u)}
function vAddDiffOp(){const ts=[()=>{const a=rand(1,4),b=rand(1,9)*100;return[`${vol(a,'l')} <span class="op">+</span> ${vol(b,'ml')} <span class="op">=</span>`,a*1000+b,'ml']},()=>{const a=rand(1,5),b=rand(1,8);return[`${vol(a,'l')} <span class="op">+</span> ${vol(b,'dl')} <span class="op">=</span>`,a*10+b,'dl']},()=>{const a=rand(1,4),b=rand(10,80);return[`${vol(a,'l')} <span class="op">+</span> ${vol(b,'cl')} <span class="op">=</span>`,a*100+b,'cl']},()=>{const a=rand(1,8),b=rand(20,200);return[`${vol(a,'dl')} <span class="op">+</span> ${vol(b,'ml')} <span class="op">=</span>`,a*100+b,'ml']},()=>{const a=rand(10,80),b=rand(50,300);return[`${vol(a,'cl')} <span class="op">+</span> ${vol(b,'ml')} <span class="op">=</span>`,a*10+b,'ml']}];const[e,v,u]=ts[rand(0,ts.length-1)]();return vTask('',e,v,u)}

const dTask=(t,v,u,h)=>({text:t,equation:'',answerType:'num',correctValue:v,correctUnit:u||'',hint:h||''});
const dFrc=(t,n,d,h)=>({text:t,equation:'',answerType:'fraction',correctNum:n,correctDen:d,hint:h||''});
function chf(x){return(Math.round(x*100)/100).toFixed(2)}
function dnum(x){return Number.isInteger(x)?String(x):String(Math.round(x*1000)/1000)}
function rand2(lo,hi){const a=rand(lo,hi);let b=rand(lo,hi),g=0;while(b===a&&g++<60)b=rand(lo,hi);return[a,b]}
const DCOMP=[12,16,18,20,24,30,36,40,48,60,72,80,90,96,120,144,180,240,360];
const DSMALL=[12,16,18,20,24,30,36,40,48,60];
function divIn(n,lo,hi){const r=[];for(let i=lo;i<=hi;i++)if(n%i===0)r.push(i);return r}
function invPair(lo,hi,pool){pool=pool||DCOMP;for(let k=0;k<80;k++){const n=pool[rand(0,pool.length-1)];const ds=divIn(n,lo,hi).filter(x=>n/x>=2);if(ds.length>=2){const i=rand(0,ds.length-1);let j=rand(0,ds.length-1);while(j===i)j=rand(0,ds.length-1);return[n,ds[i],ds[j]]}}return[24,4,6]}

let currentTopic=null,currentLevel=null,currentTask=null,attempts=0;
// Anti-Wiederholung: kein Template doppelt innerhalb des Fensters, keine identische Aufgabe innerhalb der letzten 30
const recentTplIdx={},recentSigs=[];
function pickFrom(pool,key){const rec=recentTplIdx[key]||(recentTplIdx[key]=[]);const win=Math.min(pool.length-1,Math.floor(pool.length*0.6));let i=rand(0,pool.length-1),tries=0;while(rec.includes(i)&&tries<30){i=rand(0,pool.length-1);tries++}rec.push(i);while(rec.length>win)rec.shift();return pool[i]}
function taskSig(t){return(t.text||'')+'|'+(t.equation||'')+'|'+(t.correctNum!==undefined?t.correctNum+'/'+t.correctDen:t.correctValue+''+(t.correctUnit||''))}
function generateTask(){for(let i=0;i<20;i++){const t=currentTopic==='volumen'?generateVolumeTask(currentLevel):currentTopic==='dreisatz'?generateDreisatzTask(currentLevel):generateFractionTask(currentLevel);if(!t)continue;const sig=taskSig(t);if(recentSigs.includes(sig))continue;recentSigs.push(sig);while(recentSigs.length>30)recentSigs.shift();return t}return currentTopic==='volumen'?vAddSameOp():currentTopic==='dreisatz'?generateDreisatzTask(currentLevel):addSame(currentLevel)}
function generateFractionTask(lv){if(Math.random()<0.5){const p=lv==='easy'?TEMPLATES_EASY:lv==='medium'?TEMPLATES_MEDIUM:TEMPLATES_HARD;return pickFrom(p,'ft-'+lv)()}let ops;if(lv==='easy')ops=[addSame,addSame,subSame,subSame,addDiff,simplifyFrac,fracOfNumber];else if(lv==='medium')ops=[addDiff,addDiff,subDiff,subDiff,mulFrac,divFrac,addSame,subSame,simplifyFrac,mulFracWhole,fracOfNumber];else ops=[addDiff,subDiff,mulFrac,divFrac,mixedAdd,mixedSub,mulFracWhole,fracOfNumber];return pickFrom(ops,'fo-'+lv)(lv)}
function generateVolumeTask(lv){if(Math.random()<0.5){const p=lv==='easy'?V_TEMPLATES_EASY:lv==='medium'?V_TEMPLATES_MEDIUM:V_TEMPLATES_HARD;let t,i=0;do{t=pickFrom(p,'vt-'+lv)();i++}while(!t&&i<10);return t}let ops;if(lv==='easy')ops=[vAddSameOp,vAddSameOp,vSubSameOp,vSubSameOp,vConvertOp];else if(lv==='medium')ops=[vAddDiffOp,vAddDiffOp,vSubDiffOp,vSubDiffOp,vMulOp,vDivOp,vConvertOp];else ops=[vAddDiffOp,vSubDiffOp,vMulOp,vDivOp,vConvertOp];return pickFrom(ops,'vo-'+lv)()}

function generateDreisatzTask(lv){const p=lv==='easy'?D_TEMPLATES_EASY:lv==='medium'?D_TEMPLATES_MEDIUM:D_TEMPLATES_HARD;return pickFrom(p,'dt-'+lv)()}
const questionText=document.getElementById('questionText'),equationEl=document.getElementById('equation'),submitBtn=document.getElementById('submitBtn'),nextBtn=document.getElementById('nextBtn'),feedbackEl=document.getElementById('feedback');
function renderTask(t){attempts=0;questionText.innerHTML=t.text||'';questionText.style.display=t.text?'block':'none';let h;if(t.answerType==='fraction')h=`<span class="input-fraction"><input type="number" id="numInput" placeholder="?" autofocus><span class="bar"></span><input type="number" id="denInput" placeholder="?"></span>`;else if(t.answerType==='volume')h=`<span class="input-volume"><input type="number" id="wholeInput" placeholder="?" autofocus><span class="vol-unit-label">${t.correctUnit}</span></span>`;else if(t.answerType==='num')h=`<span class="input-num"><input type="text" inputmode="decimal" id="wholeInput" placeholder="?" autocomplete="off" autofocus>${t.correctUnit?`<span class="unit">${t.correctUnit}</span>`:''}</span>`;else h=`<span class="input-whole"><input type="number" id="wholeInput" placeholder="?" autofocus></span>`;equationEl.innerHTML=(t.equation||'')+' '+h;feedbackEl.style.display='none';feedbackEl.className='feedback';submitBtn.style.display='inline-block';nextBtn.style.display='none';setTimeout(()=>{const f=document.getElementById('numInput')||document.getElementById('wholeInput');if(f)f.focus()},50);document.querySelectorAll('#equation input').forEach(i=>{i.addEventListener('keydown',e=>{if(e.key==='Enter'){if(nextBtn.style.display!=='none')nextTask();else checkAnswer()}})})}
function checkAnswer(){attempts++;const t=currentTask;let userN,userD,userVal,nc=false;if(t.answerType==='fraction'){userN=parseInt(document.getElementById('numInput').value);userD=parseInt(document.getElementById('denInput').value);if(isNaN(userN)||isNaN(userD)){showFeedback('Bitte beide Zahlen eingeben.','wrong');attempts--;return}if(userD===0){showFeedback('Der Nenner darf nicht 0 sein.','wrong');attempts--;return}nc=fracEqual(userN,userD,t.correctNum,t.correctDen)}else if(t.answerType==='num'){const raw=(document.getElementById('wholeInput').value||'').replace(/\s/g,'').replace(',','.');if(raw===''||isNaN(Number(raw))){showFeedback('Bitte eine Zahl eingeben.','wrong');attempts--;return}userVal=Number(raw);nc=Math.abs(userVal-t.correctValue)<0.005}else{userVal=parseInt(document.getElementById('wholeInput').value);if(isNaN(userVal)){showFeedback('Bitte eine Zahl eingeben.','wrong');attempts--;return}nc=userVal===t.correctValue}const ns=nc&&t.answerType==='fraction'&&!isSimplified(userN,userD);const fc=nc&&!ns;if(fc){const ms=['Super! 🎉','Genau richtig! ⭐','Klasse! 👏','Bravo! 💪','Perfekt!','Spitze!','Toll gemacht! 🌟'];showFeedback(ms[Math.floor(Math.random()*ms.length)],'correct');recordResult(true,attempts===1);submitBtn.style.display='none';nextBtn.style.display='inline-block';nextBtn.focus()}else{recordResult(false,false);let h;if(ns){const[sn,sd]=simplify(userN,userD);h=`Der Wert stimmt, aber die Antwort muss gekürzt sein. ${userN}/${userD} = ${sn}/${sd}. Probier's nochmal!`}else{h="Das stimmt noch nicht. Versuch's nochmal! 💪";if(attempts>=2&&t.hint)h='Noch nicht ganz. '+t.hint;else if(t.answerType==='fraction'&&attempts>=2){const[sn,sd]=simplify(t.correctNum,t.correctDen);h=`Noch nicht ganz. Tipp: Die gekürzte Antwort hat den Nenner ${sd}.`}else if(t.answerType==='volume'&&attempts>=2)h=`Noch nicht ganz. Tipp: Achte auf die Einheit (${t.correctUnit}) und rechne sauber um.`}if(attempts>=4){if(t.answerType==='fraction'){const[sn,sd]=simplify(t.correctNum,t.correctDen);h=`Die richtige (gekürzte) Antwort ist ${sn}/${sd}.`}else if(t.answerType==='num')h=`Die richtige Antwort ist ${dnum(t.correctValue)}${t.correctUnit?' '+t.correctUnit:''}.`;else if(t.answerType==='volume')h=`Die richtige Antwort ist ${t.correctValue} ${t.correctUnit}.`;else h=`Die richtige Antwort ist ${t.correctValue}.`}showFeedback(h,'wrong');if(t.answerType==='fraction'){document.getElementById('numInput').focus();document.getElementById('numInput').select()}else{document.getElementById('wholeInput').focus();document.getElementById('wholeInput').select()}}}
function showFeedback(t,c){feedbackEl.style.display='block';feedbackEl.className='feedback '+c;feedbackEl.textContent=t;feedbackEl.classList.add('pulse');setTimeout(()=>feedbackEl.classList.remove('pulse'),500)}
function nextTask(){currentTask=generateTask();renderTask(currentTask)}
submitBtn.addEventListener('click',checkAnswer);
nextBtn.addEventListener('click',nextTask);

let pendingTopic=null,pendingLevel=null;
function updateStartBtn(){document.getElementById('startBtn').disabled=!(pendingTopic&&pendingLevel)}
document.querySelectorAll('.choice-grid.topics .choice-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.choice-grid.topics .choice-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');pendingTopic=b.dataset.topic;updateStartBtn()})});
document.querySelectorAll('.choice-grid.levels .choice-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.choice-grid.levels .choice-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');pendingLevel=b.dataset.level;updateStartBtn()})});
document.getElementById('startBtn').addEventListener('click',()=>{if(pendingTopic&&pendingLevel)startSession(pendingTopic,pendingLevel)});
function startSession(t,l){currentTopic=t;currentLevel=l;const tl={brueche:'📐 Brüche',volumen:'🥤 Volumen',dreisatz:'⚖️ Dreisätze'},ll={easy:'Einfach',medium:'Mittel',hard:'Schwer'};document.getElementById('levelBadge').textContent=`${tl[t]} · ${ll[l]}`;document.getElementById('welcomeOverlay').classList.add('hidden');nextTask()}

// Statistik
const STORAGE_KEY='bruchrechnen_stats_v1';
function loadStats(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}}
function saveStats(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dateKey(new Date())}
function recordResult(c,ft){const s=loadStats(),k=todayKey();if(!s[k])s[k]={total:0,correct:0,firstTry:0,attempts:0};s[k].attempts++;if(c){s[k].total++;s[k].correct++;if(ft)s[k].firstTry++}saveStats(s);renderStats()}
function aggregate(s,d){let t=0;const c=new Date();c.setDate(c.getDate()-d+1);c.setHours(0,0,0,0);for(const k in s){const dt=new Date(k+'T00:00:00');if(dt>=c)t+=(s[k].total||0)}return t}
function aggregateAll(s){return Object.values(s).reduce((a,x)=>a+(x.total||0),0)}
function renderStats(){const s=loadStats(),today=s[todayKey()]||{total:0};document.getElementById('aggToday').textContent=today.total||0;document.getElementById('agg7d').textContent=aggregate(s,7);document.getElementById('agg30d').textContent=aggregate(s,30);document.getElementById('aggAll').textContent=aggregateAll(s);const ce=document.getElementById('chart'),le=document.getElementById('chartLabels');const ds=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ds.push({key:dateKey(d),date:d})}const max=Math.max(1,...ds.map(d=>s[d.key]?.total||0));ce.innerHTML=ds.map(d=>{const x=s[d.key],t=x?.total||0,p=x&&x.attempts>0?Math.round((x.correct/x.attempts)*100):0,h=t>0?Math.max(2,(t/max)*100):2,e=t===0,tt=e?`${formatDayShort(d.date)}: keine Aufgaben`:`${formatDayShort(d.date)}: ${t} gelöst, ${p}% Quote`;return`<div class="chart-bar ${e?'empty':''}" style="height:${h}%" data-tooltip="${tt}"></div>`}).join('');le.innerHTML=ds.map((d,i)=>{const sh=i===0||i===13||i%2===1;return`<div>${sh?formatDayShort(d.date):''}</div>`}).join('');const he=document.getElementById('history'),ad=Object.keys(s).filter(k=>s[k].total>0).sort().reverse().slice(0,14);if(ad.length===0){he.innerHTML='';return}he.innerHTML='<div class="chart-title" style="margin-top:16px;">Details</div>'+ad.map(d=>{const x=s[d],p=x.attempts>0?Math.round((x.correct/x.attempts)*100):0;return`<div class="history-row"><div>${formatDayLong(d)} <span style="color:#868e96">(${x.total})</span></div><div class="history-bar"><div class="history-bar-fill" style="width:${p}%"></div></div><div class="history-pct">${p}%</div></div>`}).join('')}
function formatDayShort(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'}
function formatDayLong(k){if(k===todayKey())return'Heute';const y=new Date();y.setDate(y.getDate()-1);if(k===dateKey(y))return'Gestern';const[yy,mm,dd]=k.split('-');return`${dd}.${mm}.${yy.slice(2)}`}
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('Wirklich alle Daten löschen?')){localStorage.removeItem(STORAGE_KEY);renderStats()}});

// Passwort-Gate
const PW_HASH='692dfc7c3ba3d913cd882cb48c33c54150937ed7af35c77d4da28688a9de442b';
const PW_KEY='mathe_pw_unlocked_at';
async function pwSha256(t){const b=new TextEncoder().encode(t);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function pwOk(){const t=parseInt(localStorage.getItem(PW_KEY)||'0',10);return t>0&&(Date.now()-t)<30*86400000}
async function pwTry(){const i=document.getElementById('pwInput');const h=await pwSha256(i.value);if(h===PW_HASH){localStorage.setItem(PW_KEY,Date.now().toString());document.getElementById('pwOvl').classList.add('hidden')}else{document.getElementById('pwErr').textContent='Falsches Passwort';i.value='';i.focus()}}
document.getElementById('pwBtn').addEventListener('click',pwTry);
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')pwTry()});
if(pwOk())document.getElementById('pwOvl').classList.add('hidden');else setTimeout(()=>document.getElementById('pwInput').focus(),50);

renderStats();
